include:
  - local: '/default-pipeline.yml'

# Exceção controlada ao Golden Path.
# Use somente quando uma aplicação realmente precisar customizar o fluxo.
custom-validation:
  stage: validate
  script:
    - echo "Running custom platform/business validation"

custom-security:
  stage: security
  script:
    - echo "LAB: additional security policy for this application"

